# Seed universe untuk dashboard observability
# Tier 1: high liquidity, low slippage (fokus awal)
# Tier 2: alt pairs untuk cointegration study nanti
exchange: bybit  # {bybit, binance} — public data only, no API key needed
timeframe: "1h"
history_days: 60  # berapa hari historical di-backfill saat first run

tier1:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT

tier2:
  - BNB/USDT
  - XRP/USDT
  - AVAX/USDT
  - ARB/USDT
  - OP/USDT

# Pair cointegration candidates (akan di-test rolling)
cointegration_candidates:
  - [ETH/USDT, BTC/USDT]
  - [SOL/USDT, ETH/USDT]
  - [ARB/USDT, OP/USDT]
  - [AVAX/USDT, SOL/USDT]

# Step 17.A2 — REGIME_CHANGE debounce: emit hanya saat new regime stable ≥ N
# consecutive bars. Step 11 surface noise (REGIME 89× inflation 365d replay)
# karena classify() bar-per-bar flicker tanpa filter. Default 3 = good signal/noise.
regime_debounce_bars: 3

# Portfolio accounting + risk-based sizing caps. Konsumsi oleh
# data_pipe.portfolio + data_pipe.sizing.
#
# 2026-05-23 — REGIME SHIFT: paper $10k → LIVE Binance $50 experimental capital.
# Risk parameter di-tighten untuk small-capital live experiment. Reasoning:
#  - Binance min notional ~$5; max_position 30% = $15 → room untuk 2 concurrent
#  - Fee Binance spot 0.1%/side = 0.2% round-trip; cap trade/day 3 → max 0.6%/day fee drag
#  - permanent_floor_pct baru: drop 50% equity → STOP permanent, butuh manual top-up + restart
portfolio:
  starting_capital: 50.0          # USD, real capital di Binance (path α live)
  risk_pct_per_trade: 5.0         # % equity yang di-risk per trade (size × jarak SL)
  max_position_pct: 30.0          # cap notional per posisi vs equity (~$15 @ $50)
  max_gross_exposure_pct: 60.0    # cap total |notional| open vs equity (2× position)
  max_concurrent_trades: 2        # cap jumlah open positions (conserve, kurangi fee)
  daily_loss_warn_pct: 8.0        # daily_pnl_pct ≤ -ini → emit RISK_WARN signal (~$4)
  daily_loss_killswitch_pct: 15.0 # daily_pnl_pct ≤ -ini → block ENTRY (manual reset, ~$7.5)
  permanent_floor_pct: 50.0       # equity_drawdown ≥ ini → STOP permanent (~$25)
  max_trades_per_day: 4           # cap fee drag, force selective entries
  # 2026-05-24: raised 3→4 untuk allow validated signal entry (NEAR/AVAX z=+3.76)
  # setelah cap awal hit by smoke + recovery + first live trade. Future:
  # consider reset baseline daily atau scale with conviction.

# Auto-exit triggers untuk modul data_pipe.auto_exit.
# Override default in code by editing values below. Semua opsional — kalau
# blok ini dihapus, default modul yang dipakai.
exits:
  stop_loss_pct: 5.0           # |unrealized| ≥ ini → SL fire (LONG/SHORT mirror)
  take_profit_pct: 5.0         # unrealized ≥ ini (in profit direction) → TP fire
  max_hold_hours: 72           # age trade ≥ ini → time-stop
  regime_flip_t_threshold: 6.0 # exit lebih sensitif dari ENTRY (8.0)
  window_hours: 4              # cari REGIME_CHANGE dalam window ini

# Auto-advisor detector dispatch (Step 14B). Default behavior =
# REGIME_CHANGE (Step <14B). Untuk paper backtest mode FUNDING_FLIP-only,
# set `detector_whitelist: ["FUNDING_FLIP"]` dan optionally tweak band.
# Production daemon: jangan ubah default sebelum sweep validate edge.
#
# advisor:
#   detector_whitelist: ["FUNDING_FLIP"]
#   funding_flip:
#     band_min: 0.0001   # 0.01% (decimal). Dominant band per Step 13B D3.
#     band_max: 0.0003   # 0.03% (exclusive upper).

# Funding rate thresholds untuk dashboard alerts
funding:
  # 8h rate (decimal, bukan %). 0.0005 = 0.05% per 8h ~= 0.15%/day
  neutral_band: [-0.0001, 0.0001]
  elevated: 0.0005      # warning: long bias kuat
  extreme: 0.001        # signal: funding arb window terbuka
